services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: greencode_ai
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build:
      context: /home/runner/work/CMS_PROJECT/CMS_PROJECT/backend
    env_file:
      - /home/runner/work/CMS_PROJECT/CMS_PROJECT/backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: /home/runner/work/CMS_PROJECT/CMS_PROJECT/frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pg_data:
